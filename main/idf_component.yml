# Digilog S3CAM OLED Component Dependencies
# Based on xiaozhi-esp32 ~2.5.0 / IDF 6.1 lineage

dependencies:
  idf:
    version: ">=5.3.0"
  
  # Xiaozhi managed components
  78/esp-wifi-connect:
    version: "^1.0.0"
    git: https://github.com/78/esp-wifi-connect.git
  
  # ESP LCD components
  espressif/esp_lcd_ssd1306:
    version: "^1.0.0"
  
  espressif/esp_lvgl_port:
    version: "^2.0.0"
  
  # LVGL
  lvgl/lvgl:
    version: "~9.1.0"
  
  # ESP-SR for wake word
  espressif/esp-sr:
    version: "^1.0.0"
  
  # Camera
  espressif/esp32-camera:
    version: "^2.0.0"
  
  # Xiaozhi fonts (for assets)
  xiaozhi-fonts:
    git: https://github.com/78/xiaozhi-fonts.git
    version: "*"
